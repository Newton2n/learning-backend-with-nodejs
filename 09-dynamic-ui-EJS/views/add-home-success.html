<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success | Airbnb Hosting</title>
    <link rel="stylesheet" href="/output.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-white text-gray-900">

    <nav class="sticky top-0 z-50 bg-white border-b border-gray-200 px-8 py-4 flex justify-between items-center">
        <a href="/" class="flex items-center gap-1 text-rose-500 font-bold text-2xl tracking-tight hover:opacity-80 transition">
            <span>🏠</span> <span>airbnb</span>
        </a>

        <div class="flex items-center gap-6">
            <div class="hidden md:flex gap-8 text-sm font-semibold text-gray-600">
                <a href="/" class="hover:text-black transition">Today</a>
                <a href="#" class="hover:text-black transition">Inbox</a>
                <a href="#" class="hover:text-black transition">Calendar</a>
            </div>
            
            <div class="flex items-center border border-gray-300 rounded-full p-1 pl-3 gap-2 hover:shadow-md cursor-pointer transition">
                <span class="text-xs font-bold">Menu</span>
                <div class="w-8 h-8 bg-gray-500 rounded-full flex items-center justify-center text-white text-xs">JD</div>
            </div>
        </div>
    </nav>

    <main class="max-w-3xl mx-auto px-8 py-20">
        <div class="text-center">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-green-50 rounded-full mb-6">
                <span class="text-4xl">✅</span>
            </div>
            
            <h1 class="text-4xl font-bold tracking-tight mb-4">Thanks for adding your home!</h1>
            <p class="text-gray-500 text-lg mb-10">Your listing has been created successfully and is now being processed.</p>

            <div class="flex flex-col sm:flex-row gap-4 justify-center">
                <a href="/" class="flex-1 max-w-[200px] border-2 border-gray-900 bg-gray-900 text-white text-center py-3 rounded-xl font-bold hover:bg-black transition">
                    Go to Home
                </a>

                <a href="/add-home" class="flex-1 max-w-[200px] border-2 border-gray-200 text-gray-800 text-center py-3 rounded-xl font-bold hover:border-black transition">
                    Add another
                </a>
            </div>
        </div>

        <div class="mt-16 p-6 border border-gray-100 rounded-2xl bg-gray-50 flex items-center gap-4">
            <div class="w-20 h-20 bg-gray-300 rounded-lg overflow-hidden">
                <img src="https://images.unsplash.com/photo-1493663284031-b7e3aefcae8e?auto=format&fit=crop&q=80&w=200" class="object-cover w-full h-full">
            </div>
            <div>
                <p class="text-xs font-bold uppercase text-gray-400">Next Step</p>
                <p class="text-sm font-semibold text-gray-800">Your listing will be visible to guests in about 24 hours.</p>
            </div>
        </div>
    </main>

    <div class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 p-3 flex justify-around items-center md:hidden">
        <a href="/" class="flex flex-col items-center text-rose-500">
            <span class="text-xl">🏠</span>
            <span class="text-[10px] font-bold">Today</span>
        </a>
        <div class="flex flex-col items-center text-gray-400">
            <span class="text-xl">📅</span>
            <span class="text-[10px] font-bold">Calendar</span>
        </div>
        <div class="flex flex-col items-center text-gray-400">
            <span class="text-xl">💬</span>
            <span class="text-[10px] font-bold">Inbox</span>
        </div>
    </div>

</body>
</html>
