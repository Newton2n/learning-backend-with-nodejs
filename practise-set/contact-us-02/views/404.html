<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    
    <style>
        :root {
            --primary: #6c5ce7;
            --dark: #2d3436;
            --text-gray: #636e72;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: #f9f9f9;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .container {
            padding: 20px;
        }

        .error-code {
            font-size: 10rem;
            font-weight: 900;
            color: var(--primary);
            line-height: 1;
            margin-bottom: 0;
            position: relative;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        h1 {
            font-size: 2rem;
            color: var(--dark);
            margin-bottom: 15px;
        }

        p {
            color: var(--text-gray);
            font-size: 1.1rem;
            max-width: 400px;
            margin: 0 auto 30px auto;
        }

        .home-btn {
            display: inline-block;
            padding: 14px 30px;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
        }

        .home-btn:hover {
            background-color: #5b4bc4;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(108, 92, 231, 0.4);
        }

        /* Subtle background detail */
        .ghost-icon {
            font-size: 5rem;
            display: block;
            margin-bottom: -20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <span class="ghost-icon">👻</span>
        <div class="error-code">404</div>
        <h1>Lost in Space?</h1>
        <p>The page you're looking for doesn't exist or has been moved to another galaxy.</p>
        
        <a href="/" class="home-btn">Take Me Home</a>
    </div>

</body>
</html>
