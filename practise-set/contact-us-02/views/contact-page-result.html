<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Received | Success</title>
    
    <style>
        :root {
            --success-green: #00b894;
            --primary-purple: #6c5ce7;
            --dark: #2d3436;
            --bg-light: #f4f7f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background-color: var(--bg-light);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .success-card {
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-circle {
            width: 80px;
            height: 80px;
            background-color: rgba(0, 184, 148, 0.1);
            color: var(--success-green);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            margin: 0 auto 25px auto;
            border: 2px solid var(--success-green);
            animation: scaleIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.3s both;
        }

        @keyframes scaleIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        h1 {
            color: var(--dark);
            margin-bottom: 15px;
            font-size: 1.8rem;
        }

        p {
            color: #636e72;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .back-btn {
            display: inline-block;
            text-decoration: none;
            background-color: var(--primary-purple);
            color: white;
            padding: 12px 30px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background-color: #5b4bc4;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3);
        }

        .ticket-number {
            display: block;
            margin-top: 20px;
            font-size: 0.85rem;
            color: #b2bec3;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="success-card">
        <div class="icon-circle">
            ✓
        </div>
        <h1>Message Sent!</h1>
        <p>Thank you for reaching out. We've received your request and one of our team members will get back to you within 24 hours.</p>
        
        <a href="/contact-page" class="back-btn">Return to Homepage</a>
        
        <span class="ticket-number">Ref ID: #NX-88291</span>
    </div>

</body>
</html>
